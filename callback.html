<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DropML — Autenticando...</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0f1117; color: #f0f2f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 16px; padding: 40px 36px; text-align: center; width: 360px; }
.logo { width: 56px; height: 56px; background: #FFE600; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 20px; }
h1 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
p { font-size: 13px; color: #8b8fa8; line-height: 1.6; margin-bottom: 16px; }
.spinner { width: 36px; height: 36px; border: 3px solid #2a2d3a; border-top-color: #FFE600; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.success { color: #00c48c; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.code-box { background: #21242f; border: 1px solid #2a2d3a; border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 11px; word-break: break-all; margin: 12px 0; text-align: left; color: #FFE600; cursor: pointer; }
.btn { display: block; background: #FFE600; color: #111; font-weight: 800; padding: 13px; border-radius: 10px; text-decoration: none; margin-top: 12px; font-size: 15px; border: none; cursor: pointer; width: 100%; }
.timer { font-size: 12px; color: #ff9500; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📦</div>
  <h1>DropML</h1>
  <div id="content">
    <div class="spinner"></div>
    <p>Capturando código...</p>
  </div>
</div>
<script>
const APP_URL = 'https://fredas23.github.io/dropml-app/';
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
const content = document.getElementById('content');

if (error) {
  content.innerHTML = `<p style="color:#ff4d6d">Erro: ${error}</p><a href="${APP_URL}" class="btn">← Voltar</a>`;
} else if (code) {
  // Tenta postMessage para janela pai
  if (window.opener) {
    window.opener.postMessage({ type: 'ML_OAUTH_CODE', code }, '*');
    content.innerHTML = `
      <div class="success">✅ Autenticado!</div>
      <p>Código enviado para o DropML. Esta janela fechará automaticamente.</p>`;
    setTimeout(() => window.close(), 1500);
  } else {
    // Salva no localStorage para o app pegar
    localStorage.setItem('dropml_pending_code', code);
    localStorage.setItem('dropml_pending_ts', Date.now());
    
    let secs = 55;
    content.innerHTML = `
      <div class="success">✅ Código capturado!</div>
      <p>Clique no botão abaixo para finalizar a conexão:</p>
      <div class="code-box" onclick="navigator.clipboard.writeText('${code}')" title="Clique para copiar">${code}</div>
      <a href="${APP_URL}" class="btn">🚀 Abrir DropML e conectar</a>
      <div class="timer" id="timer">Expira em ${secs}s</div>`;
    
    const t = setInterval(() => {
      secs--;
      const el = document.getElementById('timer');
      if (el) el.textContent = secs > 0 ? `Expira em ${secs}s` : '⚠️ Código expirado — volte e tente de novo';
      if (secs <= 0) clearInterval(t);
    }, 1000);
  }
} else {
  content.innerHTML = `<p>Nenhum código encontrado.</p><a href="${APP_URL}" class="btn">← Voltar</a>`;
}
</script>
</body>
</html>
